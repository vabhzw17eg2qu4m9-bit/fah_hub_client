name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Coalesced auto-release catch-up: when pushes outpace the 2h coalesce
    # window, this releases the pending commits (pub.dev caps ~12 publishes/day).
    - cron: '23 */2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - name: File size guard (no dart file over 2800 lines)
        run: |
          violations=$(find lib test -name '*.dart' \
            ! -name '*.g.dart' ! -name '*.freezed.dart' ! -name '*.mocks.dart' \
            -exec sh -c 'lines=$(wc -l < "$1"); if [ "$lines" -gt 2800 ]; then echo "$1: $lines lines"; fi' _ {} \;)
          if [ -n "$violations" ]; then echo "$violations"; exit 1; fi

      - name: Format gate (whole tree must be dart-formatted)
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: dart analyze --fatal-infos

      - name: Run tests with coverage
        run: dart test --coverage=coverage

      - name: Format coverage to lcov
        run: dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib

      # Floor 80: crap4dart.yaml pins only the CRAP threshold (20.0), no
      # coverage percentage — 80 stands until a measured ratchet pins it.
      - name: Coverage ratchet (lib/ >= 80%)
        run: |
          python3 - <<'EOF'
          import sys
          total = hit = 0
          in_lib = False
          for line in open('coverage/lcov.info'):
              if line.startswith('SF:'):
                  in_lib = '/lib/' in line[3:]
              elif in_lib and line.startswith('LF:'):
                  total += int(line.split(':')[1])
              elif in_lib and line.startswith('LH:'):
                  hit += int(line.split(':')[1])
          pct = 100.0 * hit / total if total else 0.0
          print(f'Line coverage (lib/): {pct:.1f}% (floor >= 80%)')
          sys.exit(0 if pct >= 80.0 else 1)
          EOF

      - name: CRAP ratchet (threshold pinned in crap4dart.yaml)
        run: |
          dart pub global activate crap4dart 0.2.1
          dart pub global run crap4dart analyze

      - name: Duplication guard (lib/ < 1%)
        run: |
          npx --yes jscpd@5 --min-tokens 50 --min-lines 5 --reporters json \
            --output /tmp/jscpd-ci lib/ || true
          python3 - <<'EOF'
          import json, sys
          try:
              with open('/tmp/jscpd-ci/jscpd-report.json') as f:
                  pct = json.load(f)['statistics']['total']['percentage']
          except Exception:
              pct = 0.0
          print(f'Duplication: {pct}% (threshold < 1.0%)')
          sys.exit(0 if float(pct) < 1.0 else 1)
          EOF

  release:
    name: Auto-release (patch bump + tag)
    runs-on: ubuntu-latest
    needs: quality
    # Every push to main gets a release with an auto-incremented patch version
    # (0.1.x -> 0.1.y), coalesced to <=1 per 2h — pub.dev rate-limits publishes
    # (~12/day). Release commits are skipped (loop guard). Scheduled runs catch
    # up commits that outpaced the coalesce window; the guards inside
    # scripts/auto_release.sh keep scheduled runs from duplicating releases.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):'))
      || github.event_name == 'schedule'
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      released: ${{ steps.rel.outputs.released }}
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version, changelog, tag, push and open GitHub Release
        id: rel
        run: bash scripts/auto_release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    needs: [quality, release]
    # Chained after a successful in-run release (needs.outputs), or a
    # pushed tag. `always()` is required: the release job is SKIPPED on
    # tag events (its if is main/schedule only), and a skipped need
    # otherwise forces this job to skip regardless of its own if.
    # needs.quality.result gates on real green, not just "not failed".
    if: >-
      always()
      && needs.quality.result == 'success'
      && (needs.release.outputs.released == 'true'
          || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    permissions:
      id-token: write # OIDC — pub.dev verifies the GitHub identity, no secrets
      contents: read
    steps:
      # The released tag (chained path) or the pushed tag (manual path);
      # pubspec at that ref carries the matching version by construction.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag || github.ref_name }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Verify tag matches pubspec version
        run: |
          tag="${{ needs.release.outputs.tag || github.ref_name }}"
          tag="${tag#v}"
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "tag=$tag pubspec=$version"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match pubspec version $version"
            exit 1
          fi

      - run: dart pub get

      # pub.dev requires the FIRST publish of a new package to be interactive
      # (Google OAuth) — skip green with the exact bootstrap command until
      # the package exists, then automated publishing takes over.
      - name: First-publish bootstrap guard
        id: bootstrap
        run: |
          if curl -sf https://pub.dev/api/packages/fah_hub_client >/dev/null; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Package fah_hub_client is not on pub.dev yet."
            echo "pub.dev requires the first upload of a new package to be interactive:"
            echo "  git clone https://github.com/vabhzw17eg2qu4m9-bit/fah_hub_client && cd fah_hub_client"
            echo "  git checkout ${{ needs.release.outputs.tag || github.ref_name }} && dart pub publish"
            echo "Then automated publishing (OIDC) takes over for every later tag."
          fi

      - name: Publish (automated publishing via OIDC)
        if: steps.bootstrap.outputs.skip != 'true'
        run: dart pub publish --force
